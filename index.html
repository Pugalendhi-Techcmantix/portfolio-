<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pugalendhi S, web developer in Trichy</title>
    <meta name="description" content="Pugalendhi S is a web developer in Trichy building React, Next.js, Node.js and Laravel apps, plus AI chatbots and automations with RAG and n8n." />
    <meta name="theme-color" content="#d9d2ff" />
    <meta property="og:title" content="Pugalendhi S, web developer" />
    <meta property="og:description" content="React, Next.js, Node.js, Laravel, RAG chatbots and n8n automations." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      try {
        var t = localStorage.getItem('toybox-theme')
        if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
        if (t === 'dark') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#1a0c30')
      } catch (e) {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
